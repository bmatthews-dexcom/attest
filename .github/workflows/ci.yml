name: CI

on:
  pull_request:
  push:
    branches: [main]
  # P-A15: a check nobody runs decays into a check nobody can trust. The
  # weekly run re-proves the validator fixtures + suite even when nobody
  # pushes — fixture rot surfaces on a schedule, not when a human types the
  # command.
  schedule:
    - cron: '0 8 * * 1'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # full history: ticket-hygiene evidence checks resolve fixture commits
          # (e.g. 19221158) via `git cat-file`; the default depth-1 shallow clone
          # makes them look "fabricated" and fails 3 tests (2026-07-12 CI fix).
          # The fixture SHA must also stay REACHABLE — the 2026-07-30 history
          # rewrite orphaned the previous one, which kept passing locally off a
          # dangling object while every clean clone failed (2026-08-04 CI fix).
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run agents:check
      # P-A15: every chained validator must hold its red/green fixture proof
      # (or sit on the shrinking grandfather list) — on every push/PR and on
      # the weekly schedule.
      - run: node scripts/check-validator-fixtures.mjs
      # build:claude:check only runs on push to main (post-merge). It compares
      # generated output against the committed attest-claude, which is only
      # regenerated AFTER a source PR merges — so on a feature branch that ADDS
      # a skill/agent/script it is structurally unsatisfiable and would false-
      # block the PR (2026-07-13 lesson). On main it is the correct post-merge
      # drift signal telling you to regen the generated repo.
      - name: Checkout attest-claude (public, for build:claude:check sync diff)
        if: github.event_name == 'push'
        uses: actions/checkout@v4
        with:
          repository: bpmforge/attest-claude
          path: attest-claude-sibling
      - if: github.event_name == 'push'
        run: npm run build:claude:check -- --out attest-claude-sibling
      # build:cursor:check — the Cursor target is generated INTO this repo
      # (.cursor/*), not into a sibling repo, so the drift gate runs on
      # every PR and push (unlike the Claude gate above, which is only
      # satisfiable post-merge against a separately-released repo). A
      # non-zero exit means someone edited .cursor/* by hand or forgot to
      # run `npm run build:cursor` after changing a source agent/skill.
      - run: npm run build:cursor:check

  # OpenCode ↔ Cursor target parity gate. Runs on PRs that modify any
  # source attest asset (agents/, skills/, rules/, plugins/, scripts/
  # build-target-*.mjs, scripts/target-parity.config.mjs, scripts/
  # check-target-parity.mjs, examples/opencode.json) and on every push to
  # main. The job is an added lane — it does not share `needs:` with the
  # `test` job above so it can red-light independently and keep its own
  # signal legible.
  #
  # What it does:
  #   1. `npm run build:cursor:check` against the committed .cursor/ tree
  #      (in-tree drift gate: catches hand edits to .cursor/* or a
  #      forgotten `npm run build:cursor` after changing a source).
  #   2. `node scripts/check-target-parity.mjs` — the cross-target gate.
  #      Internally regenerates BOTH targets fresh into /tmp as a smoke
  #      test (so if the Claude generator is broken, this fails loudly),
  #      then asserts every per-target difference is listed in
  #      scripts/target-parity.config.mjs.
  #
  # Why not also run `npm run build:claude:check` here:
  #   `build-target-claude.mjs --check` additionally runs a skills-parity
  #   assertion against OUT/skills/*/SKILL.md. Claude's skills are
  #   HAND-MAINTAINED in the sibling attest-claude repo (per the header
  #   of build-target-claude.mjs — the generator intentionally does not
  #   emit them). Running --check against a fresh /tmp regen reports
  #   every source skill as "missing from attest-claude" and exits 1 —
  #   the step is incoherent without a real sibling checkout. The `test`
  #   job above runs the real build:claude:check on push-to-main against
  #   the public sibling for exactly that reason; the parity script's
  #   internal regen covers "Claude generator still runs cleanly" here.
  cursor-opencode-parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Decide whether this PR touches any source attest asset
        id: changed
        run: |
          set -eu
          # Push / schedule / manual: always run.
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # PR: inspect the diff against the base. The parity script is
          # cheap (~1s), so the paths filter is a courtesy, not a cost
          # control — it keeps docs-only PRs from showing a spurious
          # third job in the Checks list.
          base='${{ github.event.pull_request.base.sha }}'
          head='${{ github.event.pull_request.head.sha }}'
          git fetch --no-tags --depth=50 origin "$base" "$head" 2>/dev/null || true
          changed=$(git diff --name-only "$base" "$head" 2>/dev/null || echo "")
          echo "$changed" | sed -n '1,80p' | sed 's/^/  /'
          match='^(agents/|skills/|rules/|plugins/|scripts/build-target-|scripts/check-target-parity|scripts/target-parity.config|examples/opencode.json|.cursor/)'
          if printf '%s\n' "$changed" | grep -Eq "$match"; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v4
        if: steps.changed.outputs.run == 'true'
        with:
          node-version: 22
          cache: npm
      - name: npm ci
        if: steps.changed.outputs.run == 'true'
        run: npm ci
      - name: build:cursor:check (in-tree Cursor target drift gate)
        if: steps.changed.outputs.run == 'true'
        run: npm run build:cursor:check
      - name: check-target-parity (OpenCode↔Cursor cross-target gate)
        if: steps.changed.outputs.run == 'true'
        run: node scripts/check-target-parity.mjs
